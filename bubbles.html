<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pop the Bubbles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background: linear-gradient(180deg, #a8edfc 0%, #c8f8c0 100%);
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      z-index: 50;
    }
    .back {
      text-decoration: none;
      font-size: 1.8rem;
      background: #fff;
      border-radius: 50%;
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }
    .back:active { transform: scale(0.9); }
    .score-box {
      background: #fff;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #f4a261;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    h1 {
      font-size: clamp(1rem, 4vw, 1.5rem);
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    }

    /* bubbles */
    .bubble {
      position: fixed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      animation: rise linear forwards;
      border: 4px solid rgba(255,255,255,0.6);
    }
    @keyframes rise {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(calc(-100vh - 180px)) scale(0.85); }
    }
    .bubble:active { transform: scale(0.8) !important; }

    /* pop animation */
    @keyframes pop-out {
      0%   { transform: scale(1); opacity: 1; }
      50%  { transform: scale(1.6); opacity: 0.5; }
      100% { transform: scale(0);   opacity: 0; }
    }
    .popping { animation: pop-out 0.25s ease forwards !important; pointer-events: none; }

    /* score pop-up */
    .score-flash {
      position: fixed;
      font-size: 2.5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
      pointer-events: none;
      animation: score-rise 0.7s ease forwards;
      z-index: 99;
    }
    @keyframes score-rise {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
    }

    /* celebration overlay */
    #celebrate {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(255,255,255,0.92);
      z-index: 200;
      font-size: clamp(3rem, 12vw, 6rem);
      text-align: center;
      display: none;
      animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop-in {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    #celebrate h2 {
      font-size: clamp(1.5rem, 6vw, 3rem);
      color: #f4a261;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
      margin-top: 12px;
    }
    #celebrate button {
      margin-top: 24px;
      padding: 16px 40px;
      font-size: 1.4rem;
      font-family: inherit;
      background: #f4a261;
      border: none;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 0 #c07a3a;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #celebrate button:active { transform: translateY(3px); box-shadow: 0 3px 0 #c07a3a; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back">🏠</a>
    <h1>Pop the Bubbles!</h1>
    <div class="score-box" id="score">0 🌟</div>
  </header>

  <div id="celebrate">
    <div>🎉🎊🎉</div>
    <h2>Amazing!</h2>
    <button onclick="restartGame()">Play Again!</button>
  </div>

  <script>
    const animals = ['🐄','🐷','🐔','🐑','🐴','🦆','🐐','🐰','🐓','🐇','🐿️','🦔'];
    const bubbleColors = [
      'rgba(255,180,120,0.75)','rgba(180,230,180,0.75)',
      'rgba(180,210,255,0.75)','rgba(255,180,200,0.75)',
      'rgba(220,180,255,0.75)','rgba(255,240,150,0.75)',
    ];

    let score = 0;
    let active = 0;
    const MAX = 12;
    let spawnTimer, celebrateTimer;

    function startGame() {
      score = 0;
      active = 0;
      updateScore();
      document.getElementById('celebrate').style.display = 'none';
      spawnLoop();
    }

    function spawnLoop() {
      if (active < 8) spawnBubble();
      spawnTimer = setTimeout(spawnLoop, 900 + Math.random() * 600);
    }

    function spawnBubble() {
      const size = 70 + Math.random() * 70; // 70–140px
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.width  = size + 'px';
      b.style.height = size + 'px';
      b.style.background = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
      b.style.fontSize = (size * 0.45) + 'px';
      b.textContent = animals[Math.floor(Math.random() * animals.length)];

      // horizontal position
      const maxLeft = window.innerWidth - size;
      b.style.left = (20 + Math.random() * (maxLeft - 40)) + 'px';
      b.style.bottom = -size + 'px';

      // rise duration
      const dur = (4 + Math.random() * 5) + 's';
      b.style.animationDuration = dur;

      active++;
      document.body.appendChild(b);

      b.addEventListener('animationend', () => {
        b.remove();
        active--;
      });

      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        popBubble(b, e.clientX, e.clientY);
      });
    }

    function popBubble(b, cx, cy) {
      if (b.classList.contains('popping')) return;
      b.classList.add('popping');
      active--;
      score++;
      updateScore();
      showScoreFlash(cx, cy);
      speak('Pop!');
      b.addEventListener('animationend', () => b.remove(), { once: true });

      if (score === MAX) {
        clearTimeout(spawnTimer);
        celebrateTimer = setTimeout(showCelebrate, 600);
      }
    }

    function showScoreFlash(x, y) {
      const el = document.createElement('div');
      el.className = 'score-flash';
      el.textContent = '⭐ +1';
      el.style.left = (x - 30) + 'px';
      el.style.top  = (y - 20) + 'px';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function showCelebrate() {
      // remove all remaining bubbles
      document.querySelectorAll('.bubble').forEach(b => b.remove());
      document.getElementById('celebrate').style.display = 'flex';
      speak('Amazing! You popped all the bubbles!');
    }

    function restartGame() {
      clearTimeout(celebrateTimer);
      document.querySelectorAll('.bubble').forEach(b => b.remove());
      startGame();
    }

    function updateScore() {
      document.getElementById('score').textContent = score + ' 🌟';
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0; u.pitch = 1.4;
      window.speechSynthesis.speak(u);
    }

    startGame();
  </script>
</body>
</html>
